<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101418">
  <meta name="description" content="Will it fit? Check any garment against one you already own.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fit Check">
  <title>Fit Check</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="logo">Fit&nbsp;Check</span>
      <button id="profile-chip" class="chip" title="Active profile"></button>
    </header>
    <main id="screen"></main>
    <nav id="tabbar">
      <button data-tab="check" class="tab active"><span class="tab-icon">&#10003;</span>Check</button>
      <button data-tab="closet" class="tab"><span class="tab-icon">&#128087;</span>My clothes</button>
      <button data-tab="profile" class="tab"><span class="tab-icon">&#128100;</span>Profile</button>
    </nav>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
